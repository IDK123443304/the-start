<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href = "recipe.css" rel="stylesheet">
    <style>
      .menu {
     display:flex;
     flex-direction:column;
     gap:12px;
}



.menu a {
    text-decoration: none;
    color: white;
    background: #1f1f1f;
    padding: 14px 16px;
    border-radius: 14px;
    transition: 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
}



.menu a:hover{
    background:rgb(106, 106, 106);
    transform:translateX(5px);
}
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            transition: 0.3s ease;
        }

       .layout {
          display:flex;
          gap:25px;
          padding:20px;
          align-items:flex-start;
        }

       
      aside {
        width:270px;
        background:#000000;
        padding:20px;
        border-radius:18px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        position:sticky;
        top:20px;
        color:white;
      }

      aside h2 {
        font-size:22px;
        margin-bottom:16px;
        padding-bottom:12px;
        border-bottom:1px solid rgba(255,255,255,0.15);
      }

      header nav a,
       header nav a:hover {
       background-color: transparent;
       border-color: transparent;
       color: white;
       }


       nav a:hover {
       background: rgba(255, 255, 255, 0.18);
       }



header nav ul {

list-style: none;

display: flex;

gap: 20px;

margin: 0;

padding: 0;

}

header nav li {

list-style: none;

}

header nav a {

text-decoration: none;

color: white;

font-weight: 600;

padding: 10px 14px;

border-radius: 10px;

display: inline-block;

transition: 0.3s ease;

background: transparent ;

}

header nav a:hover {

background: rgba(255,255,255,0.18) ;

color: white ;

}
nav ul {
    gap: 12px;
}

nav a {
    padding: 6px 10px;
}

  * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #cbcbcb;
            color: #222;
        }

        header {
            position: sticky;
            z-index: 1000;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: linear-gradient(135deg, #000000,rgb(101, 101, 101),rgb(212, 210, 210));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
          
      .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            transition: 0.3s ease;
            overflow: hidden;
            position: relative;
        }
        .corner-badge {
  position: absolute;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  z-index: 10;
}

        .card:hover {
            transform: translateY(-6px);
        }

        .card video,
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 16px;
        }

        .card-content h3 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
         main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            justify-items: center;
            justify-self: center;
            grid-row-start: reapeat(auto-fit, minmax(240px, 1fr));
        }
    </style>
</head>
<body>
     <header class="cool">
        <div class="logo">
            <h1>Get Coookin</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="recipe.html">Recipes</a></li>
                <li><a href="#">Videos</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

     <div class="layout">
        <aside>
            <h2>Cuisines</h2>
            <div class="menu">
                <a href="">Chinese</a>
                <a href="">American</a>
                <a href="">Italian</a>
                <a href="">Mexican</a>
                <a href="">Indian</a>
            </div>
            </aside>
       <main>
    <div class="card">
        <div class="corner-badge top-left">New</div>
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800" alt="Recipe">
        <div class="card-content">
            <h3>Pasta Recipe</h3>
            <p>A simple creamy pasta recipe.</p>
        </div>
    </div>
    <div class="card">
        <div class="corner-badge top-right">Popular</div>
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800" alt="Recipe">
        <div class="card-content">
            <h3>Pasta Recipe</h3>
            <p>A simple creamy pasta recipe.</p>
        </div>
    </div>
    
     <div id="recipeGrid"></div>
     <script src="recipe.js"></script>
</main>
</body>
</html>
