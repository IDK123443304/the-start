<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fafafa;
            color: #222;
        }

        header {
            position: sticky;
            z-index: 1000;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: linear-gradient(135deg, #0f0f0f, #99948e);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                background-size: 14px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .logo h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }
        .hero {
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
            url('https://img.magnific.com/free-photo/top-view-table-full-food_23-2149209253.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
            font-family: 'Arial', sans-serif;
            border-radius: 15px;   
            margin: 20px;           
            height: 300px; 
            padding: 10px;
            background-blend-mode:normal;
        }
        .hero div {

            
           max-width: 700px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            opacity: 0.95;
            
        }

        .hero h2 {
            font-size: 56px;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.35);
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            transition: 0.3s ease;
        }

       .layout {
          display:flex;
          gap:25px;
          padding:20px;
          align-items:flex-start;
        }

       
      aside {
        width:270px;
        background:#000000;
        padding:20px;
        border-radius:18px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        position:sticky;
        top:20px;
        color:white;
      }

      aside h2 {
        font-size:22px;
        margin-bottom:16px;
        padding-bottom:12px;
        border-bottom:1px solid rgba(255,255,255,0.15);
      }
      .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card video,
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 16px;
        }

        .card-content h3 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
         main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            justify-items: center;
        }



   .menu {
     display:flex;
     flex-direction:column;
     gap:12px;
}



.menu a {
    text-decoration: none;
    color: white;
    background: #1f1f1f;
    padding: 14px 16px;
    border-radius: 14px;
    transition: 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
}



.menu a:hover{
    background:rgb(106, 106, 106);
    transform:translateX(5px);
}
</style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Get Coookin</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Recipes</a></li>
                <li><a href="#">Videos</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
    <div>
        <h2>Discover World Recipes</h2>
        <p>Watch, learn, and cook delicious recipes from around the world.</p>
    </div>
    </section>

    <div class="layout">
        <aside>
            <h2>Categories</h2>
            <div class="menu">
                <a href="">Chinese</a>
                <a href="">American</a>
                <a href="">Italian</a>
                <a href="">Mexican</a>
                <a href="">Indian</a>
            </div>
        </aside>
        <main>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800" alt="Recipe">
                <div class="card-content">
                    <h3>Pasta Recipe</h3>
                    <p>A simple creamy pasta recipe with rich flavor and easy steps.</p>
                </div>
            </div>
            </div>
        </main>
    </div>
